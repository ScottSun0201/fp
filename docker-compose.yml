version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fp-app
    ports:
      - "8090:8090"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    environment:
      - PORT=8090
      - SECRET_KEY=fp-prod-secret-change-me
    env_file:
      - ./backend/.env
    restart: unless-stopped
