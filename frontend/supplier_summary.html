<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>供应商统计 - LWFP</title>
  <style>
    :root{--bg:#f7f9fd;--panel:#fff;--line:#d8dde6;--text:#162033;--muted:#667085;--blue:#3478ff;--soft:#edf3ff;--ok:#0f7a4f;--bad:#b42318;--warn:#b54708}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;overflow:hidden}.shell{height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr);gap:20px;padding:20px;overflow:hidden}.side,.panel,.top{background:#fff;border:1px solid var(--line);border-radius:8px}.side{height:calc(100vh - 40px);padding:28px 24px;position:relative;overflow:hidden}.main{height:calc(100vh - 40px);min-width:0;display:flex;flex-direction:column;overflow:hidden}.brand{font-size:28px;font-weight:850;color:#2765d8}.sub,.muted{color:var(--muted);font-size:13px}.menu-title{margin-top:42px;color:var(--muted);font-size:12px}.nav{position:relative;margin-top:14px;padding-left:28px}.nav:before{content:"";position:absolute;left:10px;top:8px;bottom:8px;border-left:2px solid var(--blue)}.nav a{display:block;height:46px;line-height:46px;color:var(--text);text-decoration:none;font-weight:700}.nav a:before{content:"";display:inline-block;width:28px;border-top:2px solid var(--blue);vertical-align:middle;margin:0 10px 0 -18px}.nav a.active{background:var(--soft);color:#2765d8;border-radius:6px;padding-left:8px}.logout{position:absolute;left:32px;right:32px;bottom:32px;height:40px;background:var(--blue);color:#fff;border-radius:6px;text-align:center;line-height:40px;text-decoration:none;font-weight:800}.top{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top h1{font-size:20px}.btn{height:34px;border:0;border-radius:6px;padding:0 13px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.btn.secondary{background:var(--soft);color:#2765d8}.panel{padding:16px;margin-top:14px;min-height:0}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;flex:0 0 auto}.card{border:1px solid #e4e9f4;background:#fff;border-radius:6px;padding:10px 12px;min-width:0}.card span{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:18px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table-panel{flex:1;display:flex;flex-direction:column}.table-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.supplier-filters{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(130px,1fr) minmax(130px,1fr) minmax(190px,1.4fr) minmax(210px,1.6fr) 88px;gap:8px;margin-bottom:12px}.table-wrap{min-height:0;flex:1;overflow:auto;border:1px solid #e4e9f4;border-radius:6px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #dfe6f2;padding:10px;text-align:left;white-space:nowrap}th{background:#f2f4f7;color:var(--muted);position:sticky;top:0;z-index:1}a{color:#2765d8;text-decoration:none;font-weight:800}.ok{color:var(--ok);font-weight:800}.bad{color:var(--bad);font-weight:800}.warn{color:var(--warn);font-weight:800}.blueText{color:#2765d8;font-weight:800}.overText{color:#7a2ec8;font-weight:800}.money{font-weight:800;color:var(--ok)}.tools{display:flex;gap:8px;align-items:center}input,select{height:34px;border:1px solid #aeb8c8;border-radius:6px;padding:0 10px;background:#fff;min-width:0}.table-wrap tbody tr.row-paid td,.detail-wrap tbody tr.row-paid td{background:#f0fdf4}.table-wrap tbody tr.row-unpaid td,.detail-wrap tbody tr.row-unpaid td{background:#fff1f0}.table-wrap tbody tr.row-partial td,.detail-wrap tbody tr.row-partial td{background:#eff6ff}.table-wrap tbody tr.row-overpaid td,.detail-wrap tbody tr.row-overpaid td{background:#f6f0ff}.table-wrap tbody tr.row-paid td:first-child,.detail-wrap tbody tr.row-paid td:first-child{box-shadow:inset 4px 0 0 #0f7a4f}.table-wrap tbody tr.row-unpaid td:first-child,.detail-wrap tbody tr.row-unpaid td:first-child{box-shadow:inset 4px 0 0 #b42318}.table-wrap tbody tr.row-partial td:first-child,.detail-wrap tbody tr.row-partial td:first-child{box-shadow:inset 4px 0 0 #2765d8}.table-wrap tbody tr.row-overpaid td:first-child,.detail-wrap tbody tr.row-overpaid td:first-child{box-shadow:inset 4px 0 0 #7a2ec8}.modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.28);align-items:flex-start;justify-content:center;padding:54px 24px 24px;z-index:1000}.modal.open{display:flex}.dialog{width:min(1280px,calc(100vw - 64px));height:min(720px,calc(100vh - 90px));background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;overflow:hidden}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.dialog-head h2{margin:0;font-size:20px}.detail-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.detail-wrap{min-height:0;flex:1;overflow:auto;border:1px solid #e4e9f4;border-radius:6px}.detail-wrap table{min-width:1160px}
  </style>
</head>
<body><div class="shell"><aside class="side"><div class="brand">LWFP</div><div class="sub">协议发票对账系统</div><div class="menu-title">主菜单</div><nav class="nav"><a href="/">首页</a><a href="/management">对账管理</a><a href="/management?status=ERP_FAILED">异常处理</a><a href="/delivery">快递对账</a><a class="active" href="/supplier-summary">供应商统计</a><a href="javascript:void(0)">系统设置</a><a href="javascript:void(0)">操作日志</a></nav><a class="logout" href="/logout">退出</a></aside>
<main class="main"><section class="top"><h1>供应商统计</h1><div class="tools"><a class="btn secondary" href="/management">返回对账管理</a><button id="refresh" class="btn">刷新</button></div></section>
<section class="panel summary" id="summary"></section>
<section class="panel table-panel"><div class="table-head"><h2 style="margin:0;font-size:18px">按供应商汇总</h2><span id="total" class="muted">共 0 家</span></div><div class="supplier-filters"><input id="kw" placeholder="搜索全部字段"><input id="supplierFilter" placeholder="供应商"><input id="supplierCodeFilter" placeholder="供应商编码"><select id="paymentStatusFilter"><option value="">全部付款状态</option><option value="UNPAID">未付</option><option value="PARTIAL_PAID">少付</option><option value="OVER_PAID">多付</option><option value="PAID">已付</option></select><select id="invoiceStatusFilter"><option value="">全部开票状态</option><option value="UNINVOICED">未开票</option><option value="UNDER_INVOICED">少开票</option><option value="OVER_INVOICED">多开票</option><option value="INVOICED">已开票</option></select><button id="resetFilters" class="btn secondary" type="button">重置</button></div><div class="table-wrap"><table><thead><tr><th>供应商</th><th>供应商编码</th><th>对账单数</th><th>对账金额</th><th>付款金额</th><th>开票金额</th><th>未付</th><th>少付</th><th>多付</th><th>已付</th><th>未开票</th><th>少开票</th><th>多开票</th><th>已开票</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div>
<div id="detailModal" class="modal"><div class="dialog"><div class="dialog-head"><h2 id="detailTitle">供应商详情</h2><button id="closeDetail" class="btn secondary" type="button">关闭</button></div><div class="detail-tools"><span id="detailSummary" class="muted"></span><input id="detailKw" placeholder="搜索详情全部字段"></div><div class="detail-wrap"><table><thead><tr><th>创建时间</th><th>供应商</th><th>供应商编码</th><th>对账单编码</th><th>对账时间</th><th>对账金额</th><th>付款金额</th><th>付款时间</th><th>开票金额</th><th>开票时间</th><th>ERP</th><th>付款状态</th><th>开票状态</th><th>总状态</th></tr></thead><tbody id="detailRows"></tbody></table></div></div></div>
<script>
let rows=[],detailRows=[];
const statusText={PASS:'通过',FAIL:'异常',WAITING_INVOICE:'待上传发票',ERP_FAILED:'ERP异常',INVOICE_FAILED:'发票异常',COMPLETED:'已完成',NOT_UPLOADED:'未上传',PAID:'已付',PARTIAL_PAID:'少付',UNPAID:'未付',OVER_PAID:'多付',INVOICED:'已开票',UNINVOICED:'未开票',UNDER_INVOICED:'少开票',OVER_INVOICED:'多开票'};
function fmtMoney(v){const n=Number(v||0);return Number.isFinite(n)?n.toFixed(2):v}
function st(v){return statusText[v]||v||'-'}
function cls(v){return v==='PASS'||v==='COMPLETED'||v==='PAID'||v==='INVOICED'?'ok':v==='PARTIAL_PAID'||v==='UNDER_INVOICED'||v==='WAITING_INVOICE'||v==='NOT_UPLOADED'?'blueText':v==='OVER_PAID'?'overText':v==='OVER_INVOICED'?'warn':v==='ERP_FAILED'||v==='INVOICE_FAILED'||v==='FAIL'||v==='UNPAID'||v==='UNINVOICED'?'bad':''}
function payRowClass(x){if(Number(x.over_paid_count||0)>0||x.payment_status==='OVER_PAID')return 'row-overpaid';if(Number(x.unpaid_count||0)>0||x.payment_status==='UNPAID')return 'row-unpaid';if(Number(x.partial_paid_count||0)>0||x.payment_status==='PARTIAL_PAID')return 'row-partial';if(Number(x.paid_count||0)>0||x.payment_status==='PAID')return 'row-paid';return ''}
function searchable(x){return Object.values(x).map(v=>st(v)).concat(Object.values(x)).join(' ').toLowerCase()}
function sumRows(items){return items.reduce((a,x)=>{for(const k of ['statement_count','unpaid_count','partial_paid_count','over_paid_count','paid_count','uninvoiced_count','partial_invoice_count','over_invoice_count','invoiced_count'])a[k]=(a[k]||0)+Number(x[k]||0);for(const k of ['statement_amount','payment_amount','invoice_amount'])a[k]=(a[k]||0)+Number(x[k]||0);return a},{})}
function hasPaymentStatus(x,status){if(status==='PAID')return Number(x.paid_count||0)>0;if(status==='PARTIAL_PAID')return Number(x.partial_paid_count||0)>0;if(status==='OVER_PAID')return Number(x.over_paid_count||0)>0;if(status==='UNPAID')return Number(x.unpaid_count||0)>0;return true}
function hasInvoiceStatus(x,status){if(status==='INVOICED')return Number(x.invoiced_count||0)>0;if(status==='UNDER_INVOICED')return Number(x.partial_invoice_count||0)>0;if(status==='OVER_INVOICED')return Number(x.over_invoice_count||0)>0;if(status==='UNINVOICED')return Number(x.uninvoiced_count||0)>0;return true}
function render(){
  const kw=document.getElementById('kw').value.trim().toLowerCase();
  const supplier=document.getElementById('supplierFilter').value.trim().toLowerCase();
  const supplierCode=document.getElementById('supplierCodeFilter').value.trim().toLowerCase();
  const paymentStatus=document.getElementById('paymentStatusFilter').value;
  const invoiceStatus=document.getElementById('invoiceStatusFilter').value;
  const list=rows.filter(x=>(!kw||searchable(x).includes(kw))&&(!supplier||String(x.supplier||'').toLowerCase().includes(supplier))&&(!supplierCode||String(x.supplier_code||'').toLowerCase().includes(supplierCode))&&hasPaymentStatus(x,paymentStatus)&&hasInvoiceStatus(x,invoiceStatus));
  const total=sumRows(list);
  document.getElementById('total').textContent=`共 ${list.length} 家`;
  document.getElementById('summary').innerHTML=`<div class="card"><span>供应商数</span><strong>${list.length}</strong></div><div class="card"><span>对账单数</span><strong>${total.statement_count||0}</strong></div><div class="card"><span>对账金额</span><strong>${fmtMoney(total.statement_amount)}</strong></div><div class="card"><span>付款金额</span><strong class="money">${fmtMoney(total.payment_amount)}</strong></div><div class="card"><span>开票金额</span><strong class="money">${fmtMoney(total.invoice_amount)}</strong></div><div class="card"><span>未付</span><strong class="bad">${total.unpaid_count||0}</strong></div>`;
  const body=list.map(x=>`<tr class="${payRowClass(x)}"><td>${x.supplier||'-'}</td><td>${x.supplier_code||'-'}</td><td>${x.statement_count||0}</td><td>${fmtMoney(x.statement_amount)}</td><td class="money">${fmtMoney(x.payment_amount)}</td><td class="money">${fmtMoney(x.invoice_amount)}</td><td class="bad">${x.unpaid_count||0}</td><td class="blueText">${x.partial_paid_count||0}</td><td class="overText">${x.over_paid_count||0}</td><td class="ok">${x.paid_count||0}</td><td class="bad">${x.uninvoiced_count||0}</td><td class="blueText">${x.partial_invoice_count||0}</td><td class="warn">${x.over_invoice_count||0}</td><td class="ok">${x.invoiced_count||0}</td><td><a href="#" class="detail-link" data-supplier="${encodeURIComponent(x.supplier||'-')}" data-code="${encodeURIComponent(x.supplier_code||'-')}">详情</a></td></tr>`).join('');
  const foot=list.length?`<tr><td><b>合计</b></td><td>-</td><td><b>${total.statement_count||0}</b></td><td><b>${fmtMoney(total.statement_amount)}</b></td><td class="money"><b>${fmtMoney(total.payment_amount)}</b></td><td class="money"><b>${fmtMoney(total.invoice_amount)}</b></td><td class="bad">${total.unpaid_count||0}</td><td class="blueText">${total.partial_paid_count||0}</td><td class="overText">${total.over_paid_count||0}</td><td class="ok">${total.paid_count||0}</td><td class="bad">${total.uninvoiced_count||0}</td><td class="blueText">${total.partial_invoice_count||0}</td><td class="warn">${total.over_invoice_count||0}</td><td class="ok">${total.invoiced_count||0}</td><td>-</td></tr>`:'';
  document.getElementById('rows').innerHTML=body+foot||'<tr><td colspan="15" class="muted">暂无统计</td></tr>';
}
function renderDetail(){
  const kw=document.getElementById('detailKw').value.trim().toLowerCase();
  const list=kw?detailRows.filter(x=>searchable(x).includes(kw)):detailRows;
  const total=sumRows(list);
  document.getElementById('detailSummary').textContent=`共 ${list.length} 条，对账金额 ${fmtMoney(total.statement_amount)}，付款金额 ${fmtMoney(total.payment_amount)}，开票金额 ${fmtMoney(total.invoice_amount)}`;
  document.getElementById('detailRows').innerHTML=list.map(x=>`<tr class="${payRowClass(x)}"><td>${x.created_at||'-'}</td><td>${x.supplier||'-'}</td><td>${x.supplier_code||'-'}</td><td>${x.statement_no||'-'}</td><td>${x.statement_time||'-'}</td><td>${fmtMoney(x.statement_total)}</td><td class="${cls(x.payment_status)}">${fmtMoney(x.payment_amount)}</td><td>${x.payment_date||'-'}</td><td class="${cls(x.invoice_amount_status)}">${fmtMoney(x.invoice_amount)}</td><td>${x.invoice_date||'-'}</td><td class="${cls(x.overall_status==='ERP_FAILED'?'FAIL':'PASS')}">${st(x.overall_status==='ERP_FAILED'?'FAIL':'PASS')}</td><td class="${cls(x.payment_status)}">${st(x.payment_status)}</td><td class="${cls(x.invoice_amount_status)}">${st(x.invoice_amount_status)}</td><td class="${cls(x.overall_status)}">${st(x.overall_status)}</td></tr>`).join('')||'<tr><td colspan="14" class="muted">暂无明细</td></tr>';
}
async function openDetail(supplier,supplierCode){
  const name=decodeURIComponent(supplier);
  const code=decodeURIComponent(supplierCode);
  document.getElementById('detailTitle').textContent=`供应商详情：${name}`;
  document.getElementById('detailKw').value='';
  document.getElementById('detailModal').classList.add('open');
  const p=new URLSearchParams();
  p.set('supplier',name);
  p.set('supplier_code',code);
  const r=await fetch('/api/history/supplier-summary/details?'+p.toString());
  const d=await r.json();
  detailRows=d.rows||[];
  renderDetail();
}
async function load(){
  const r=await fetch('/api/history/supplier-summary');
  const d=await r.json();
  rows=d.rows||[];
  render();
}
for(const id of ['kw','supplierFilter','supplierCodeFilter','paymentStatusFilter','invoiceStatusFilter'])document.getElementById(id).oninput=render;
document.getElementById('resetFilters').onclick=()=>{for(const id of ['kw','supplierFilter','supplierCodeFilter','paymentStatusFilter','invoiceStatusFilter'])document.getElementById(id).value='';render()};
document.getElementById('detailKw').oninput=renderDetail;
document.getElementById('closeDetail').onclick=()=>document.getElementById('detailModal').classList.remove('open');
document.getElementById('rows').onclick=e=>{const link=e.target.closest('.detail-link');if(!link)return;e.preventDefault();openDetail(link.dataset.supplier,link.dataset.code)};
document.getElementById('refresh').onclick=load;
load();
</script></body></html>
